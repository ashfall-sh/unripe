name: unripe dependency cooldown
description: Fail when a locked dependency version was published more recently than you trust
author: glumly
branding:
  icon: clock
  color: green

inputs:
  min-age:
    description: How old every locked version must be, like 72h, 3d or 1w. Empty uses the config file, then 3d.
    required: false
    default: ""
  since:
    description: >
      Only check versions added since this git ref. Empty means the pull request's base commit on
      pull_request events and everything otherwise. "none" always checks everything.
    required: false
    default: ""
  paths:
    description: Lockfiles or directories to check, separated by spaces or new lines. Empty uses the config file, then the whole repository.
    required: false
    default: ""
  exclude:
    description: Packages to skip, one pattern per line, like `left-pad`, `@types/*` or `npm:@myorg/*`.
    required: false
    default: ""
  unknown:
    description: What a version with an unknown publish time does, fail or warn. Empty uses the config file, then fail.
    required: false
    default: ""
  config:
    description: A config file to read instead of .unripe.toml or pyproject.toml.
    required: false
    default: ""
  summary:
    description: Write a markdown report to the job summary.
    required: false
    default: "true"
  sarif:
    description: Also write a SARIF report to this path, for github/codeql-action/upload-sarif.
    required: false
    default: ""
  comment:
    description: >
      On pull requests, also post the report as a comment when something is too new or unknown, and keep
      that one comment up to date on later runs. Needs `pull-requests: write`.
    required: false
    default: "false"
  github-token:
    description: The token used to comment on pull requests.
    required: false
    default: ${{ github.token }}
  annotations:
    description: Mark each version that is too new or unknown on its lockfile line in the pull request's files view.
    required: false
    default: "true"
  fail:
    description: Set to false to report without failing the job when something is too new or unknown, to try unripe out first.
    required: false
    default: "true"
  workflows:
    description: Also check the actions this repository's workflows use, dated by their GitHub releases.
    required: false
    default: "false"
  python-version:
    description: The Python that runs unripe. uv downloads it when the runner does not have it.
    required: false
    default: "3.13"

outputs:
  result:
    description: pass, fail or error
    value: ${{ steps.unripe.outputs.result }}
  unripe:
    description: How many versions were too new
    value: ${{ steps.unripe.outputs.unripe }}
  unknown:
    description: How many versions had an unknown age
    value: ${{ steps.unripe.outputs.unknown }}
  report:
    description: The path of the markdown report
    value: ${{ steps.unripe.outputs.report }}
  json:
    description: The path of the JSON report
    value: ${{ steps.unripe.outputs.json }}

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        enable-cache: false
        ignore-empty-workdir: true
    - name: Run unripe
      id: unripe
      shell: bash
      env:
        INPUT_MIN_AGE: ${{ inputs.min-age }}
        INPUT_SINCE: ${{ inputs.since }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_UNKNOWN: ${{ inputs.unknown }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_PYTHON: ${{ inputs.python-version }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
        INPUT_FAIL: ${{ inputs.fail }}
        INPUT_WORKFLOWS: ${{ inputs.workflows }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action.sh"

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: python -m pip install pytest==9.1.1
      - name: Run tests
        run: python -m pytest -q

  action:
    # runs the action from this commit against real registries, on fixtures old enough to pass
    name: action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: unripe
        with:
          paths: |
            tests/testdata/live
            .github
            action.yml
          since: none
          sarif: unripe.sarif
          comment: true
          workflows: true
      - name: Check the action's outputs
        shell: bash
        env:
          RESULT: ${{ steps.unripe.outputs.result }}
          TOO_NEW: ${{ steps.unripe.outputs.unripe }}
          REPORT: ${{ steps.unripe.outputs.json }}
        run: |
          test "$RESULT" = pass
          test "$TOO_NEW" = 0
          test -s "$REPORT"
